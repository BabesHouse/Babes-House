<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Babe's House in Tucson, Arizona.">
  <title>Contact | Babe's House</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">BABE'S HOUSE</a>
    <nav aria-label="Main navigation">
      <a href="index.html">Events</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <p class="eyebrow">Get in touch</p>
      <h1>Let's chat.</h1>
    </section>

   <section class="content-section contact-layout">
  <div class="content-narrow">

    <p class="large-copy contact-copy">Questions, collaborations, private gatherings, or just saying hello?</p>
    <p class="contact-copy">Fill out the form below and we'll get back to you.</p>

    <form action="https://script.google.com/macros/s/AKfycbzc1WENwD5IFN6Zf9tqMMfggDchIR6HoJ3dJ_GcfvPw0mGHiwh-GpwrjxShjsiSc2UqbA/exec" method="POST">

      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit" class="button">Send Message</button>

    </form>

    <div class="contact-detail">
      <p class="eyebrow">Follow us</p>
      <a class="text-link" href="#">Instagram →</a>
    </div>

  </div>
</section>
  </main>

  <footer class="site-footer">
    <span>© 2026 Babe's House</span>
    <span>Tucson, Arizona</span>
  </footer>
</body>
</html>
